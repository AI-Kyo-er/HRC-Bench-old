<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f1e7">
  <title>鳄鱼的慢骑日记 · SVG 动画</title>
  <style>
    :root { color-scheme: light; --ink: #254a3d; --paper: #f4f1e7; --muted: #758276; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; }
    main { max-width: 1160px; margin: auto; padding: 38px 48px 26px; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 20px; }
    .brand { display: flex; align-items: center; gap: 11px; font-size: 14px; font-weight: 700; letter-spacing: 2px; }
    .brand svg { width: 32px; height: 32px; }
    .edition { font-size: 11px; letter-spacing: 2px; color: var(--muted); }
    .intro { text-align: center; margin: 42px 0 8px; }
    .eyebrow { margin: 0 0 13px; color: #879280; font-size: 11px; letter-spacing: 4px; }
    h1 { margin: 0; font-size: clamp(30px, 4.5vw, 49px); font-weight: 650; letter-spacing: 5px; }
    .subtitle { margin: 16px 0 0; color: var(--muted); font-size: 14px; letter-spacing: 2px; }
    .scene { position: relative; margin-top: 10px; }
    #illustration { width: 100%; height: auto; display: block; overflow: visible; }
    .scene-note { position: absolute; top: 40px; left: 25px; display: flex; align-items: center; gap: 8px; font-size: 11px; letter-spacing: 1px; color: #7a8879; }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: #819b64; }
    .controls { margin: -18px auto 0; width: fit-content; display: flex; align-items: center; gap: 23px; padding: 13px 21px; border: 1px solid #dce0d1; border-radius: 50px; background: #faf8f0; position: relative; }
    button { font: inherit; color: var(--ink); cursor: pointer; }
    #toggle { background: var(--ink); color: #fffdf4; border: none; border-radius: 24px; padding: 10px 17px; min-width: 101px; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 12px; }
    #toggle:hover { background: #39614f; }
    #toggle svg { width: 13px; height: 13px; fill: currentColor; }
    .speed-control { display: flex; align-items: center; gap: 11px; font-size: 12px; }
    input[type="range"] { width: 90px; accent-color: #627e50; cursor: pointer; }
    output { min-width: 34px; font-size: 11px; font-variant-numeric: tabular-nums; }
    button:focus-visible, input:focus-visible { outline: 3px solid #cfa75d; outline-offset: 5px; }
    footer { display: flex; justify-content: space-between; gap: 15px; margin-top: 32px; padding-top: 20px; border-top: 1px solid #dce0d1; color: #879080; font-size: 11px; letter-spacing: 1px; }
    .stroke { stroke: #254a3d; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    .thin { stroke-width: 2.5; }
    @media (max-width: 600px) {
      main { padding: 23px 18px; }
      .edition { font-size: 9px; letter-spacing: 1px; }
      .intro { margin-top: 38px; }
      h1 { letter-spacing: 3px; }
      .subtitle { font-size: 12px; letter-spacing: 1px; }
      .scene { margin: 30px -12px 15px; }
      .scene-note { top: 0; left: 24px; font-size: 9px; }
      .controls { margin-top: 0; gap: 12px; padding: 10px 12px; }
      .speed-control { gap: 7px; }
      input[type="range"] { width: 65px; }
      footer { font-size: 9px; letter-spacing: 0; }
    }
  </style>
</head>
<body>
<main>
  <header>
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="11" fill="#254a3d"/><path d="M7 19Q7 11 14 12L18 14H25V20H14Z" fill="#a9c884"/><circle cx="13" cy="12" r="3" fill="#a9c884"/><circle cx="14" cy="12" r="1" fill="#254a3d"/><path d="M18 18H25" stroke="#254a3d" stroke-width="1.5"/></svg>
      慢骑俱乐部
    </div>
    <span class="edition">一段悠闲的好时光 / 001</span>
  </header>
  <section class="intro" aria-labelledby="title">
    <p class="eyebrow">把日子，骑得慢一点</p>
    <h1 id="title">今天，鳄鱼不赶路。</h1>
    <p class="subtitle">风吹过河岸，快乐刚好两轮。</p>
  </section>
  <div class="scene">
    <div class="scene-note"><span class="dot"></span><span id="ride-status" aria-live="polite">河岸骑行中</span></div>
    <svg id="illustration" viewBox="0 0 1000 580" role="img" aria-labelledby="svg-title svg-desc">

        <pattern id="paper-grain" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="2" cy="4" r=".65" fill="#254a3d" opacity=".055"/><circle cx="11" cy="12" r=".5" fill="#254a3d" opacity=".04"/></pattern>

      <g id="rider-tail" class="stroke">
        <path d="M526 313C472 318 407 309 364 279C350 269 337 249 329 230C368 258 423 263 470 265L537 280Z" fill="#87aa69"/>
        <path d="M348 250L343 235L361 249L366 242L381 260L390 250L406 268L416 258L432 275L445 265L461 282" fill="#608453" stroke-width="3"/>

      <path id="far-shoe" class="stroke" d="M507 431H531" fill="none" stroke="#d7bc79" stroke-width="12"/>
      <g id="bicycle" class="stroke">
        <g transform="translate(396 423)">
          <circle r="88" fill="#f5f1df" stroke="#254a3d" stroke-width="9"/>
          <circle r="80" fill="#e4e8d7" stroke="#d4cda8" stroke-width="3"/>
          <g id="rear-spokes"><use href="#spokes"/></g>

          <circle r="88" fill="#f5f1df" stroke="#254a3d" stroke-width="9"/>
          <circle r="80" fill="#e4e8d7" stroke="#d4cda8" stroke-width="3"/>
          <g id="front-spokes"><use href="#spokes"/></g>
          <circle r="8" fill="#e2b158" stroke-width="3"/>
        </g>
        <path d="M396 423L490 328L550 423H396L666 328H490M550 423L666 328L734 423" fill="none" stroke="#254a3d" stroke-width="13"/>
        <path d="M396 423L490 328L550 423H396L666 328H490M550 423L666 328L734 423" fill="none" stroke="#d49a59" stroke-width="7"/>
        <path d="M490 328L483 309M666 328L654 286L686 279" fill="none" stroke-width="9"/>
        <path d="M668 279H692Q708 280 705 294" fill="none" stroke-width="7"/>
        <path d="M459 308Q478 301 505 307Q511 310 504 315H461Q451 314 459 308Z" fill="#654e3b"/>
        <path d="M372 330Q416 312 451 348" fill="none" stroke="#839780" stroke-width="4"/>
        <path d="M678 354Q744 303 795 353" fill="none" stroke="#839780" stroke-width="4"/>
        <path d="M399 413L482 315" fill="none" stroke="#80947c" stroke-width="2"/>
        <path d="M685 287L713 347" fill="none" stroke="#80947c" stroke-width="2"/>
        <circle cx="550" cy="423" r="22" fill="#e8d8a7" stroke-width="3"/>
        <circle cx="550" cy="423" r="14" fill="none" stroke="#9c9b72" stroke-width="2"/>
        <path d="M398 423L550 441M398 423L550 405" fill="none" stroke="#788373" stroke-width="2"/>
        <g id="crank"><path d="M-31 0H31" transform="translate(550 423)" stroke="#254a3d" stroke-width="6"/></g>
        <circle cx="550" cy="423" r="6" fill="#254a3d" stroke="none"/>
      </g>
      <g id="rider-body" class="stroke">
        <!-- 身体、腹部和背部的小鳞片。 -->
        <path d="M504 306C480 295 482 269 502 237L545 192Q569 183 589 206C607 229 594 269 568 294Q537 321 504 306Z" fill="#91b773"/>
        <path d="M564 214Q592 225 578 259Q568 284 538 297L526 281Q552 256 554 234Z" fill="#d2d49a" stroke="none"/>
        <path d="M547 248L577 253M538 266L565 274M526 283L549 292" fill="none" stroke="#a3b17d" stroke-width="2.5"/>
        <path d="M498 247L486 237L502 228L495 216L516 212L513 199L533 200" fill="#608453" stroke-width="3"/>
        <g fill="#6f985a" stroke="none"><ellipse cx="512" cy="262" rx="5" ry="7" transform="rotate(30 512 262)"/><circle cx="527" cy="241" r="4"/><circle cx="508" cy="282" r="3"/></g>
        <!-- 长吻、鼻孔、牙齿和微笑。 -->
        <path d="M556 214L556 175Q554 154 575 145Q592 137 606 153L631 165L707 165Q735 164 740 181Q744 198 726 205L620 221Q590 235 566 220Z" fill="#91b773"/>
        <path d="M608 202L730 191Q727 210 701 216L615 230Q586 233 575 217" fill="#c6d499"/>
        <path d="M608 202L723 194Q731 193 734 187" fill="none" stroke-width="3"/>
        <g fill="#fff9dd" stroke-width="2"><path d="M633 201L639 211L645 200Z"/><path d="M657 198L663 208L669 197Z"/><path d="M682 196L688 205L694 195Z"/></g>
        <ellipse cx="717" cy="176" rx="4" ry="3" fill="#254a3d" stroke="none"/>
        <path d="M698 170L704 169" fill="none" stroke-width="2"/>
        <ellipse cx="607" cy="189" rx="10" ry="6" fill="#d0aa77" stroke="none" opacity=".7"/>
        <g id="eye" transform="translate(584 164)"><ellipse rx="12" ry="15" fill="#fff9e5" stroke-width="3"/><ellipse cx="4" cy="1" rx="4" ry="7" fill="#254a3d" stroke="none"/><circle cx="5" cy="-2" r="1.5" fill="#fff" stroke="none"/></g>
        <path d="M569 142Q582 133 592 140" fill="none" stroke-width="3"/>
        <!-- 黄色骑行头盔。 -->
        <path d="M544 147Q539 114 571 109Q607 104 615 139L619 149Q583 138 544 154Z" fill="#e7b756"/>
        <path d="M544 148Q580 136 619 149" fill="none" stroke-width="6"/>
        <path d="M560 119L558 134M577 116L578 131M594 120L598 134" stroke="#b9893f" stroke-width="4"/>
        <path d="M549 154L556 192L572 205L593 194" fill="none" stroke-width="3"/>
        <rect x="567" y="198" width="10" height="7" rx="2" fill="#254a3d" stroke="none"/>
        <!-- 围巾尾端会随骑行轻轻摆动。 -->
        <path id="scarf" d="M552 210Q508 205 473 186L466 206Q504 229 557 224Z" fill="#c77558"/>
        <path d="M553 207Q565 220 583 222L577 233Q558 235 546 219Z" fill="#d98867"/>
        <path d="M474 190L470 201" stroke="#efb292" stroke-width="2"/>
      </g>
      <path id="near-leg-outline" d="M521 304L580 352L581 423" fill="none" stroke="#254a3d" stroke-width="29" stroke-linecap="round" stroke-linejoin="round"/>
      <path id="near-leg" d="M521 304L580 352L581 423" fill="none" stroke="#91b773" stroke-width="21" stroke-linecap="round" stroke-linejoin="round"/>
      <g id="near-foot" class="stroke"><path d="M-13-8Q-5-14 5-8L20-5Q25-2 22 4H-12Z" fill="#dfc382" stroke-width="3"/><path d="M11-6V-1M17-5V0" fill="none" stroke-width="2"/></g>
      <g id="rider-arm" class="stroke">
        <path d="M573 236Q598 252 621 268L677 283" fill="none" stroke="#254a3d" stroke-width="23"/>
        <path d="M573 236Q598 252 621 268L677 283" fill="none" stroke="#91b773" stroke-width="16"/>
        <path d="M668 278Q676 269 683 275L694 280Q699 286 692 290L674 288Z" fill="#91b773" stroke-width="3"/>
        <path d="M681 278L681 284M687 280L687 285" fill="none" stroke-width="2"/>
      </g>
      <g id="near-pedal" class="stroke"><path d="M-14 0H14" stroke-width="5"/></g>
      <g id="far-pedal" class="stroke"><path d="M-12 0H12" stroke-width="4"/></g>
      <g id="foreground" opacity=".85"><use href="#grass" x="165" y="512"/><use href="#flower" x="204" y="511"/><use href="#grass" x="859" y="514"/><use href="#flower" x="887" y="512"/></g>
      <g id="breeze" fill="none" stroke="#9aaa90" stroke-width="2.5" stroke-linecap="round"><path d="M303 195H337M286 213H317M310 231H328"/></g>
    </svg>
  </div>
  <div class="controls" aria-label="动画控制">
    <button id="toggle" type="button" aria-label="暂停动画" aria-pressed="false"><svg viewBox="0 0 16 16" aria-hidden="true"><path id="toggle-icon" d="M3 2H6V14H3ZM10 2H13V14H10Z"/></svg><span id="toggle-label">歇一会儿</span></button>
    <label class="speed-control" for="speed">骑行速度 <input id="speed" type="range" min="0.5" max="2" step="0.25" value="1"><output id="speed-value" for="speed">1.00×</output></label>
  </div>
  <footer><span>今日路线：河岸 → 好心情</span><span>纯 SVG 绘制 · 离线也能快乐骑行</span></footer>
</main>
<script>
  (() => {
    'use strict';
    const el = id => document.getElementById(id);
    const motionPreference = matchMedia('(prefers-reduced-motion: reduce)');
    let paused = motionPreference.matches;
    let speed = 1;
    let time = 0;
    let lastTimestamp = null;
    let animationId = null;
    const tau = Math.PI * 2;
    const translate = (node, x, y) => node.setAttribute('transform', `translate(${x.toFixed(2)} ${y.toFixed(2)})`);

    // 两段肢体的逆运动学让脚始终贴着脚踏，膝盖保持自然弯曲。
    function legPath(hip, foot, upperLength, lowerLength) {
      const dx = foot.x - hip.x, dy = foot.y - hip.y;
      const distance = Math.hypot(dx, dy);
      const along = (upperLength ** 2 - lowerLength ** 2 + distance ** 2) / (2 * distance);
      const bend = Math.sqrt(Math.max(0, upperLength ** 2 - along ** 2));
      const kneeX = hip.x + dx * along / distance + dy * bend / distance;
      const kneeY = hip.y + dy * along / distance - dx * bend / distance;
      return `M${hip.x} ${hip.y}L${kneeX} ${kneeY}L${foot.x} ${foot.y}`;
    }

    function render() {
      const angle = time * tau * .65;
      const bob = Math.sin(angle * 2) * 2;
      const front = { x: 550 + Math.cos(angle) * 31, y: 423 + Math.sin(angle) * 31 };
      const back = { x: 550 - Math.cos(angle) * 31, y: 423 - Math.sin(angle) * 31 };
      const nearPath = legPath({ x: 520, y: 301 + bob }, { x: front.x, y: front.y - 8 }, 78, 80);
      el('near-leg').setAttribute('d', nearPath);
      el('near-leg-outline').setAttribute('d', nearPath);
      el('far-leg').setAttribute('d', legPath({ x: 510, y: 300 + bob }, { x: back.x, y: back.y - 7 }, 77, 83));
      el('far-shoe').setAttribute('d', `M${back.x - 12} ${back.y - 5}H${back.x + 13}`);
      translate(el('near-foot'), front.x, front.y - 4);
      translate(el('near-pedal'), front.x, front.y + 3);
      translate(el('far-pedal'), back.x, back.y + 2);
      el('crank').setAttribute('transform', `rotate(${angle * 180 / Math.PI} 550 423)`);
      // 齿比使车轮转速约为曲柄的两倍。
      for (const wheel of ['front-spokes', 'rear-spokes']) {
        el(wheel).setAttribute('transform', `rotate(${angle * 180 / Math.PI * 2.1})`);
      }
      translate(el('rider-body'), 0, bob);
      translate(el('rider-tail'), 0, bob);
      // 肩部随身体起伏，手始终握住固定车把。
      const arm = `M573 ${236 + bob}Q598 ${252 + bob / 2} 621 268L677 283`;
      el('rider-arm').querySelectorAll('path').forEach((path, index) => { if (index < 2) path.setAttribute('d', arm); });
      const flutter = Math.sin(angle * 1.4) * 5;
      el('scarf').setAttribute('d', `M552 210Q508 ${205 + flutter} 473 ${186 + flutter}L466 ${206 + flutter}Q504 ${229 + flutter} 557 224Z`);
      const blinkPhase = time % 4.7;
      const eyeScale = blinkPhase > 4.5 ? Math.max(.08, Math.abs(blinkPhase - 4.6) / .1) : 1;
      el('eye').setAttribute('transform', `translate(584 164) scale(1 ${eyeScale})`);
      translate(el('cloud-a'), 165 - (time * 3 % 360), 121);
      el('cloud-b').setAttribute('transform', `translate(${485 - (time * 2 % 280)} 81) scale(.7)`);
      el('cloud-c').setAttribute('transform', `translate(${820 - (time * 2.5 % 390)} 212) scale(.65)`);
      translate(el('road-marks'), -(time * 100 % 180), 0);
      el('breeze').setAttribute('opacity', (.45 + Math.sin(angle) * .2).toFixed(2));
      el('bike-shadow').setAttribute('rx', (240 + bob).toFixed(2));
    }

    function tick(timestamp) {
      animationId = null;
      if (paused || document.hidden) return;
      if (lastTimestamp !== null) time += Math.min((timestamp - lastTimestamp) / 1000, .05) * speed;
      lastTimestamp = timestamp;
      render();
      animationId = requestAnimationFrame(tick);
    }

    function schedule() {
      lastTimestamp = null;
      if (!paused && !document.hidden && animationId === null) animationId = requestAnimationFrame(tick);
    }

    function updateControls() {
      el('toggle').setAttribute('aria-pressed', String(paused));
      el('toggle').setAttribute('aria-label', paused ? '继续动画' : '暂停动画');
      el('toggle-label').textContent = paused ? '继续出发' : '歇一会儿';
      el('toggle-icon').setAttribute('d', paused ? 'M4 2L14 8L4 14Z' : 'M3 2H6V14H3ZM10 2H13V14H10Z');
      el('ride-status').textContent = paused ? '在河岸歇一会儿' : '河岸骑行中';
    }

    function setPaused(value) {
      paused = value;
      if (animationId !== null) cancelAnimationFrame(animationId);
      animationId = null;
      updateControls();
      schedule();
    }

    el('toggle').addEventListener('click', () => setPaused(!paused));
    el('speed').addEventListener('input', event => {
      speed = Number(event.target.value);
      el('speed-value').value = `${speed.toFixed(2)}×`;
      el('speed').setAttribute('aria-valuetext', `${speed.toFixed(2)} 倍速`);
    });
    document.addEventListener('visibilitychange', () => {
      if (document.hidden && animationId !== null) {
        cancelAnimationFrame(animationId);
        animationId = null;
      }
      schedule();
    });
    motionPreference.addEventListener('change', event => setPaused(event.matches));
    render();
    updateControls();
    schedule();
  })();
</script>
</body>
</html>
